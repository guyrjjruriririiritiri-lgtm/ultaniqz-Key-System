<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>SULTANIQZ | Key System</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/">SULTANIQZ<span>.</span></a>
      <span class="status"><i></i> SYSTEM ONLINE</span>
    </header>
    <section class="hero">
      <div class="eyebrow">ROBLOX SCRIPT ACCESS</div>
      <h1>KEY <span>SYSTEM</span></h1>
      <p class="muted">Get your access key and unlock the script.</p>
    </section>
    <section class="panel">
      <div class="panel-title">ACCESS KEY</div>
      <label class="sr-only" for="keyInput">Enter access key</label>
      <input id="keyInput" placeholder="Enter your access key..." autocomplete="off">
      <button id="verifyBtn" class="btn btn-red">VERIFY KEY</button>
      <div class="or"><span></span> OR <span></span></div>
      <button id="getKeyBtn" class="btn btn-outline">GET KEY</button>
      <a id="discordBtn" class="btn btn-discord" href="https://discord.gg/your-invite" target="_blank" rel="noopener">JOIN DISCORD</a>
      <p id="message" class="message" aria-live="polite"></p>
    </section>
    <section class="stats">
      <div class="stat-card"><strong id="totalUsers">—</strong><span>TOTAL USERS</span></div>
      <div class="stat-card"><strong class="green">LIVE</strong><span>SYSTEM STATUS</span></div>
    </section>
    <footer>SULTANIQZ © <span id="year"></span></footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
